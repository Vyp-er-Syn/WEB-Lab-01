<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal & Stem | Master System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Unified Theme Variables */
        :root {
            --bg-color: #E4F1FF;
            --secondary: #AED2FF;
            --accent: #9400FF;
            --primary: #27005D;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }

        /* Navigation Menu */
        nav {
            background: var(--secondary);
            padding: 15px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-tab {
            background: none;
            border: none;
            font-size: 1em;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
            padding: 10px 15px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-tab.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        .nav-tab:hover {
            color: var(--accent);
        }

        /* App Layout */
        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .view-section {
            display: none;
            background: var(--bg-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: fadeIn 0.3s ease-in-out;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Reused Form & Table Styles */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid var(--primary); border-radius: 6px; box-sizing: border-box; background: var(--bg-color); color: var(--primary); }
        .submit-btn { background-color: var(--accent); color: var(--bg-color); border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .submit-btn:hover { background-color: var(--primary); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--secondary); font-size: 0.9em; }
        th { background-color: var(--secondary); color: var(--primary); }

        /* Reused Calendar Styles */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-header h2 { margin: 0; text-transform: uppercase; font-size: 1.2em; }
        .cal-nav-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; color: var(--primary); }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 0.8em; color: var(--primary); margin-bottom: 15px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .day { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; border-radius: 10px; cursor: pointer; font-weight: 600; position: relative; background-color: var(--secondary); color: var(--primary); }
        .day:hover { background-color: var(--primary); color: var(--bg-color); }
        .day.empty { cursor: default; background: transparent; }
        .day.active { background-color: var(--accent); color: var(--bg-color); }
        .day.has-orders { background-color: var(--secondary); color: var(--primary); box-shadow: inset 0 0 0 2px var(--accent); }
        .day.active.has-orders { background-color: var(--accent); color: var(--bg-color); }
        .order-count { position: absolute; top: 5px; right: 6px; min-width: 20px; height: 20px; padding: 0 4px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background-color: var(--accent); color: var(--bg-color); font-size: 0.75em; font-weight: 700; }
        .day.active.has-orders .order-count { background-color: var(--primary); color: var(--bg-color); }

        /* Order Details in Calendar */
        .back-btn { background: var(--primary); color: var(--bg-color); border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
        .order-card { border-left: 4px solid var(--accent); background: var(--secondary); padding: 15px; margin-bottom: 15px; }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; color: var(--bg-color); background: var(--accent); margin-top: 10px; }

        /* Home Hub */
        .home-intro { text-align: center; color: var(--primary); margin-bottom: 30px; }
        .home-intro h1 { margin: 0 0 10px; }
        .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .quick-action { border: 2px solid var(--secondary); border-radius: 12px; padding: 28px 20px; background: var(--secondary); color: var(--primary); cursor: pointer; text-align: center; transition: transform 0.2s, background-color 0.2s, color 0.2s; }
        .quick-action:hover { transform: translateY(-4px); background: var(--accent); color: var(--bg-color); }
        .quick-action h3 { margin: 0 0 10px; }
        .quick-action p { margin: 0; }
        @media (max-width: 700px) { .quick-actions { grid-template-columns: 1fr; } }

        /* Analytics Dashboard */
        .analytics-heading { color: var(--primary); margin-top: 0; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0 30px; }
        .kpi-card { background: var(--secondary); border-left: 5px solid var(--accent); border-radius: 8px; padding: 18px; color: var(--primary); }
        .kpi-card h3 { margin: 0 0 8px; font-size: 0.9em; }
        .kpi-value { display: block; font-size: 2em; font-weight: 700; }
        .chart-container { position: relative; height: 360px; background: var(--secondary); border-radius: 10px; padding: 15px; box-sizing: border-box; }
        @media (max-width: 800px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .kpi-grid { grid-template-columns: 1fr; } .chart-container { height: 300px; } }

        /* Notification */
        #notification { position: fixed; bottom: -60px; right: 20px; background-color: var(--primary); color: var(--bg-color); padding: 15px 25px; border-radius: 8px; transition: bottom 0.4s ease-in-out; z-index: 1000; }
        #notification.show { bottom: 20px; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav>
        <button class="nav-tab active" data-section="home" onclick="switchMainTab('home', this)">Home</button>
        <button class="nav-tab" data-section="booking" onclick="switchMainTab('booking', this)">+ New Booking</button>
        <button class="nav-tab" data-section="calendar" onclick="switchMainTab('calendar', this)">Visual Calendar</button>
        <button class="nav-tab" data-section="dashboard" onclick="switchMainTab('dashboard', this)">List & Status</button>
        <button class="nav-tab" data-section="analytics" onclick="switchMainTab('analytics', this)">Analytics</button>
    </nav>

    <div class="app-container">

        <!-- HOME HUB -->
        <div id="home-section" class="view-section active">
            <div class="home-intro">
                <h1>Welcome to Petal &amp; Stem</h1>
                <p>Manage florist appointments, orders, and schedules from one place.</p>
            </div>
            <div class="quick-actions">
                <button class="quick-action" onclick="switchMainTab('booking', this)">
                    <h3>+ New Booking</h3>
                    <p>Create a florist appointment.</p>
                </button>
                <button class="quick-action" onclick="switchMainTab('calendar', this)">
                    <h3>Visual Calendar</h3>
                    <p>View orders by scheduled day.</p>
                </button>
                <button class="quick-action" onclick="switchMainTab('dashboard', this)">
                    <h3>List &amp; Status</h3>
                    <p>Review orders and update status.</p>
                </button>
            </div>
        </div>

        <!-- SECTION 1: BOOKING FORM -->
        <div id="booking-section" class="view-section">
            <h2 style="color: var(--primary);">Book an Appointment</h2>
            <form id="appointmentForm">
                <div class="form-group"><label>Full Name</label><input type="text" id="name" required></div>
                <div class="form-group"><label>Telephone</label><input type="tel" id="phone" required></div>
                <div class="form-group"><label>Address</label><textarea id="address" rows="2" required></textarea></div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="orderType">Order Type</label>
                        <select id="orderType" required>
                            <option value="" selected disabled>Select a category</option>
                            <option value="Bouquet">Bouquet</option>
                            <option value="Decoration">Decoration</option>
                            <option value="Flower Order">Flower Order</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="orderSubType">Specific Type</label>
                        <select id="orderSubType" required disabled>
                            <option value="" selected disabled>Select a category first</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="specialDetails">Special Details</label>
                    <textarea id="specialDetails" rows="3" placeholder="Add any custom requests or instructions"></textarea>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;"><label>Date</label><input type="date" id="date" required></div>
                    <div class="form-group" style="flex: 1;"><label>Time</label><input type="time" id="time" required></div>
                </div>
                <button type="submit" class="submit-btn">Confirm Booking</button>
            </form>
        </div>

        <!-- SECTION 2: VISUAL CALENDAR -->
        <div id="calendar-section" class="view-section">
            
            <!-- Calendar Grid View -->
            <div id="calendar-grid-view">
                <div class="calendar-header">
                    <button class="cal-nav-btn" onclick="changeMonth(-1)">&#10094;</button>
                    <h2 id="month-year-display"></h2>
                    <button class="cal-nav-btn" onclick="changeMonth(1)">&#10095;</button>
                </div>
                <div class="weekdays">
                    <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                </div>
                <div class="days-grid" id="calendar-days"></div>
            </div>

            <!-- Specific Day Details View -->
            <div id="day-details-view" style="display: none;">
                <button class="back-btn" onclick="closeDayDetails()">&#8592; Back to Calendar</button>
                <h2 id="selected-date-title" style="margin-top: 0;"></h2>
                <div id="order-list"></div>
            </div>

        </div>

        <!-- SECTION 3: LIST DASHBOARD -->
        <div id="dashboard-section" class="view-section">
            <h2 style="color: var(--primary);">All Orders</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Order Details</th>
                            <th>Appt. Date/Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentList"></tbody>
                </table>
            </div>
        </div>

        <!-- SECTION 4: ANALYTICS DASHBOARD -->
        <div id="analytics-section" class="view-section">
            <h2 class="analytics-heading">Analytics Dashboard</h2>
            <div class="kpi-grid">
                <div class="kpi-card">
                    <h3>Total Orders</h3>
                    <span class="kpi-value" id="total-orders-kpi">0</span>
                </div>
                <div class="kpi-card">
                    <h3>New / Received</h3>
                    <span class="kpi-value" id="received-orders-kpi">0</span>
                </div>
                <div class="kpi-card">
                    <h3>In Progress</h3>
                    <span class="kpi-value" id="in-progress-orders-kpi">0</span>
                </div>
                <div class="kpi-card">
                    <h3>Completed</h3>
                    <span class="kpi-value" id="completed-orders-kpi">0</span>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="status-chart" aria-label="Orders by status bar chart"></canvas>
            </div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="notification"></div>

    <script>
        // --- 1. CORE DATA LOGIC ---
        let appointments = JSON.parse(localStorage.getItem('flowerAppts')) || [];
        let statusChart;
        
        function saveData() {
            localStorage.setItem('flowerAppts', JSON.stringify(appointments));
            // Instantly update both views when data changes
            renderDashboard();
            renderCalendar(); 
            renderAnalytics();
        }

        // --- 2. MAIN NAVIGATION LOGIC ---
        function switchMainTab(sectionId, clickedBtn) {
            // Hide all sections
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            // Remove active class from all tabs
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            
            // Show requested section and highlight its navigation tab
            document.getElementById(sectionId + '-section').classList.add('active');
            const navTab = document.querySelector(`.nav-tab[data-section="${sectionId}"]`);
            if (navTab) navTab.classList.add('active');

            // If navigating back to calendar, ensure grid is showing (not day details)
            if(sectionId === 'calendar') {
                closeDayDetails(); 
            }
        }

        // --- 3. FORM SUBMISSION ---
        const subCategoryOptions = {
            'Bouquet': ['Wedding', 'Funeral', 'Birthday', 'Valentine', 'Graduation'],
            'Decoration': ['Wedding', 'Birthday', 'Katina Ceremony'],
            'Flower Order': ['Roses', 'Lilies', 'Orchids', 'Carnations', 'Mixed Seasonal']
        };

        document.getElementById('orderType').addEventListener('change', function() {
            const subCategory = document.getElementById('orderSubType');
            const options = subCategoryOptions[this.value] || [];
            subCategory.innerHTML = '<option value="" selected disabled>Select a specific type</option>';
            options.forEach(option => {
                subCategory.insertAdjacentHTML('beforeend', `<option value="${option}">${option}</option>`);
            });
            subCategory.disabled = options.length === 0;
        });

        document.getElementById('appointmentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newAppt = {
                id: Date.now(),
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                orderType: document.getElementById('orderType').value,
                orderSubType: document.getElementById('orderSubType').value,
                specialDetails: document.getElementById('specialDetails').value.trim(),
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                status: 'Received'
            };

            appointments.push(newAppt);
            saveData(); 
            this.reset();
            const subCategory = document.getElementById('orderSubType');
            subCategory.innerHTML = '<option value="" selected disabled>Select a category first</option>';
            subCategory.disabled = true;
            showNotification('Appointment successfully booked!');
        });

        // --- 4. CALENDAR LOGIC ---
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        function renderCalendar() {
            const daysGrid = document.getElementById('calendar-days');
            daysGrid.innerHTML = ''; 

            const date = new Date(currentYear, currentMonth);
            document.getElementById('month-year-display').textContent = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day empty';
                daysGrid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                dayDiv.innerHTML = `<span>${i}</span>`;

                const fullDateString = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                // Check database for orders
                const ordersForDay = appointments.filter(appt => appt.date === fullDateString);
                if (ordersForDay.length > 0) {
                    dayDiv.classList.add('has-orders');
                    dayDiv.insertAdjacentHTML('beforeend', `<span class="order-count" aria-label="${ordersForDay.length} orders">${ordersForDay.length}</span>`);
                }

                if (i === new Date().getDate() && currentMonth === new Date().getMonth() && currentYear === new Date().getFullYear()) {
                    dayDiv.classList.add('active');
                }

                dayDiv.onclick = () => openDayDetails(fullDateString, i);
                daysGrid.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; } 
            else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        }

        function openDayDetails(dateString, dayNumber) {
            document.getElementById('calendar-grid-view').style.display = 'none';
            document.getElementById('day-details-view').style.display = 'block';

            const displayDate = new Date(dateString + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            document.getElementById('selected-date-title').textContent = `Orders for ${displayDate}`;

            const orderList = document.getElementById('order-list');
            orderList.innerHTML = ''; 
            
            const daysOrders = appointments.filter(appt => appt.date === dateString).sort((a, b) => a.time.localeCompare(b.time));

            if (daysOrders.length === 0) {
                orderList.innerHTML = '<p>No orders for this date.</p>';
                return;
            }

            daysOrders.forEach(order => {
                orderList.innerHTML += `
                    <div class="order-card">
                        <h4 style="margin:0;">${escapeHTML(order.time)} - ${escapeHTML(order.name)}</h4>
                        <p style="margin:5px 0;"><strong>Phone:</strong> ${escapeHTML(order.phone)} | <strong>Address:</strong> ${escapeHTML(order.address)}</p>
                        <p style="margin:5px 0;"><strong>Order:</strong> ${escapeHTML(order.orderType || 'Not specified')} - ${escapeHTML(order.orderSubType || 'Not specified')}</p>
                        ${order.specialDetails ? `<p style="margin:5px 0;"><strong>Special Details:</strong> ${escapeHTML(order.specialDetails)}</p>` : ''}
                        <span class="status-badge">${order.status}</span>
                    </div>
                `;
            });
        }

        function closeDayDetails() {
            document.getElementById('day-details-view').style.display = 'none';
            document.getElementById('calendar-grid-view').style.display = 'block';
        }

        // --- 5. ANALYTICS DASHBOARD ---
        function renderAnalytics() {
            const statusCounts = {
                Received: appointments.filter(appt => appt.status === 'Received').length,
                Preparing: appointments.filter(appt => appt.status === 'Preparing').length,
                Ready: appointments.filter(appt => appt.status === 'Ready').length,
                Completed: appointments.filter(appt => appt.status === 'Completed').length
            };

            document.getElementById('total-orders-kpi').textContent = appointments.length;
            document.getElementById('received-orders-kpi').textContent = statusCounts.Received;
            document.getElementById('in-progress-orders-kpi').textContent = statusCounts.Preparing + statusCounts.Ready;
            document.getElementById('completed-orders-kpi').textContent = statusCounts.Completed;

            const chartData = {
                labels: Object.keys(statusCounts),
                datasets: [{
                    label: 'Orders',
                    data: Object.values(statusCounts),
                    backgroundColor: ['#9400FF', '#27005D', '#AED2FF', '#E4F1FF'],
                    borderColor: '#27005D',
                    borderWidth: 1
                }]
            };

            if (statusChart) {
                statusChart.data = chartData;
                statusChart.update();
                return;
            }

            statusChart = new Chart(document.getElementById('status-chart'), {
                type: 'bar',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: 'Orders by Status', color: '#27005D' }
                    },
                    scales: {
                        x: { ticks: { color: '#27005D' }, grid: { color: '#E4F1FF' } },
                        y: { beginAtZero: true, ticks: { stepSize: 1, color: '#27005D' }, grid: { color: '#E4F1FF' } }
                    }
                }
            });
        }

        // --- 6. DASHBOARD LIST LOGIC ---
        function renderDashboard() {
            const list = document.getElementById('appointmentList');
            list.innerHTML = ''; 
            
            const sortedAppts = appointments.slice().reverse(); // Newest first

            sortedAppts.forEach(appt => {
                list.innerHTML += `
                    <tr>
                        <td><strong>${escapeHTML(appt.name)}</strong><br><small>${escapeHTML(appt.phone)}</small></td>
                        <td><strong>${escapeHTML(appt.orderType || 'Not specified')}</strong><br><small>${escapeHTML(appt.orderSubType || 'Not specified')}</small>${appt.specialDetails ? `<br><small>${escapeHTML(appt.specialDetails)}</small>` : ''}</td>
                        <td>${escapeHTML(appt.date)} <br><small>${escapeHTML(appt.time)}</small></td>
                        <td><span class="status-badge" style="background:${getStatusColor(appt.status)}">${appt.status}</span></td>
                        <td>
                            <select onchange="updateStatus(${appt.id}, this.value)" style="padding:5px;">
                                <option value="" disabled selected>Update...</option>
                                <option value="Received">Received</option>
                                <option value="Preparing">Preparing</option>
                                <option value="Ready">Ready</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        }

        window.updateStatus = function(id, newStatus) {
            const index = appointments.findIndex(a => a.id === id);
            if (index !== -1) {
                appointments[index].status = newStatus;
                saveData(); // Will auto-trigger renderDashboard and renderCalendar
                showNotification(`Status updated to ${newStatus}`);
            }
        };

        function getStatusColor(status) {
            switch(status) {
                case 'Received': return 'var(--accent)';
                case 'Preparing': return 'var(--primary)';
                case 'Ready': return 'var(--accent)';
                case 'Completed': return 'var(--primary)';
                default: return 'var(--primary)';
            }
        }

        // --- 7. UTILS & INIT ---
        function escapeHTML(value) {
            return String(value || '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[character]));
        }

        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        // Run on load
        renderDashboard();
        renderCalendar();
        renderAnalytics();
    </script>
</body>
</html>
